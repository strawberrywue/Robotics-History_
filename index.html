<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotics & Tech History Quiz</title>
  <style>
    /* Sleek Glassmorphism Dark Theme */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #151522);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    #quiz-app {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #4facfe;
    }

    #progress-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      height: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: #4facfe;
      transition: width 0.3s ease;
    }

    .question {
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .option-btn {
      display: block;
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      font-size: 1em;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      transform: none;
    }

    .correct-btn {
      background: rgba(40, 167, 69, 0.4) !important;
      border-color: #28a745 !important;
    }

    .wrong-btn {
      background: rgba(220, 53, 69, 0.4) !important;
      border-color: #dc3545 !important;
    }

    #feedback {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
    }

    .score-text {
      text-align: center;
      font-size: 1.5em;
      color: #4facfe;
    }
  </style>
</head>
<body>

  <div id="quiz-app">
    <h1 id="quiz-title">Robotics History Quiz</h1>
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <div id="quiz-container">
      <div class="question" id="question-text">Loading question...</div>
      <div id="options-container"></div>
    </div>
    <div id="feedback"></div>
  </div>

  <script>
    const quizData = [
      { question: "In 1801, who invented the textile machine operated by punch cards?", options: ["Charles Babbage", "Joseph Jacquard", "George Devol", "Blaise Pascal"], answer: "Joseph Jacquard" },
      { question: "Who designed a motorized crane with a gripper to remove ingots from a furnace in 1892?", options: ["Seward Babbitt", "Thomas Edison", "George Boole", "Raymond Goertz"], answer: "Seward Babbitt" },
      { question: "In what year did the word 'robot' first appear in a play?", options: ["1892", "1921", "1939", "1946"], answer: "1921" },
      { question: "What play first referenced the word 'robot'?", options: ["Runaround", "Cybernetics", "Rossum’s Universal Robots", "The Analytical Engine"], answer: "Rossum’s Universal Robots" },
      { question: "Who wrote the play 'Rossum’s Universal Robots'?", options: ["Isaac Asimov", "Karel Čapek", "George Devol", "Norbert Wiener"], answer: "Karel Čapek" },
      { question: "The word 'robot' comes from the Czech word 'robota', which means:", options: ["Steel machine", "Artificial mind", "Serf or forced labor", "Helper"], answer: "Serf or forced labor" },
      { question: "Who introduced robots designed for humanity and safety in his 1939 science fiction writings?", options: ["Karel Čapek", "Alan Turing", "Isaac Asimov", "Joseph Engelberger"], answer: "Isaac Asimov" },
      { question: "Who formulated the 'Three Laws of Robotics'?", options: ["Isaac Asimov", "George Devol", "Norbert Wiener", "Marvin Minsky"], answer: "Isaac Asimov" },
      { question: "In 1946, who patented a general-purpose playback device for controlling machines?", options: ["George Devol", "Joseph Engelberger", "Alan Turing", "Thomas Edison"], answer: "George Devol" },
      { question: "Who published 'Cybernetics' in 1948, describing communications and control systems?", options: ["Norbert Wiener", "Warren S. McCulloch", "Alan Turing", "George Boole"], answer: "Norbert Wiener" },
      { question: "In 1951, who designed a tele-operator equipped with an articulated arm for the Atomic Energy Commission?", options: ["Marvin Minsky", "Raymond Goertz", "Joseph Engelberger", "Nikola Tesla"], answer: "Raymond Goertz" },
      { question: "Who designed the first programmable robot in 1954?", options: ["George Devol", "Blaise Pascal", "Raymond Goertz", "Isaac Asimov"], answer: "George Devol" },
      { question: "Who coined the term 'universal automation'?", options: ["George Devol", "Joseph Engelberger", "Alan Turing", "Karel Čapek"], answer: "George Devol" },
      { question: "Who joined George Devol in 1956 to form the first successful robot manufacturing company?", options: ["Joseph Engelberger", "Marvin Minsky", "Seward Babbitt", "Norbert Wiener"], answer: "Joseph Engelberger" },
      { question: "What was the name of the first successful robot manufacturing company formed by Devol and Engelberger?", options: ["Unimation", "Kawasaki Robotics", "SpaceX", "Honda Robotics"], answer: "Unimation" },
      { question: "In 1642, who built an early version of the calculator that was later mass-produced?", options: ["Charles Babbage", "Blaise Pascal", "Benjamin Franklin", "George Boole"], answer: "Blaise Pascal" },
      { question: "Who conducted the famous kite experiment in 1752 proving lightning is electricity?", options: ["Benjamin Franklin", "Nikola Tesla", "Thomas Edison", "Joseph John Thomson"], answer: "Benjamin Franklin" },
      { question: "What automation system utilizing punch cards did Joseph-Marie Jacquard invent in 1804?", options: ["Jacquard loom", "Analytical engine", "Tele-operator", "Playback device"], answer: "Jacquard loom" },
      { question: "In 1835, who designed an analytical engine complete with processor and memory functions?", options: ["Blaise Pascal", "Charles Babbage", "George Boole", "Alan Turing"], answer: "Charles Babbage" },
      { question: "Who published 'Mathematical Analysis of Logic' in 1847?", options: ["Alan Turing", "George Boole", "Charles Babbage", "Isaac Asimov"], answer: "George Boole" },
      { question: "What type of math, widely used in computing, was developed by George Boole?", options: ["Calculus", "Linear Algebra", "Boolean algebra", "Trigonometry"], answer: "Boolean algebra" },
      { question: "Who created the concept for the modern AC induction motor in 1882?", options: ["Thomas Edison", "Nikola Tesla", "George Devol", "Seward Babbitt"], answer: "Nikola Tesla" },
      { question: "Who invented a talking doll in 1887 that was marketed to the public in 1890?", options: ["Thomas Edison", "Nikola Tesla", "Benjamin Franklin", "Charles Babbage"], answer: "Thomas Edison" },
      { question: "Who designed the world's first AC power plant at Niagara Falls in 1895?", options: ["Thomas Edison", "Nikola Tesla", "Joseph John Thomson", "Joseph Engelberger"], answer: "Nikola Tesla" },
      { question: "Who created experiments in 1897 that helped infer the existence of the electron?", options: ["Nikola Tesla", "Joseph John Thomson", "Alan Turing", "Thomas Edison"], answer: "Joseph John Thomson" },
      { question: "Who patented a design for a radio-controlled boat in 1898?", options: ["Nikola Tesla", "Thomas Edison", "Benjamin Franklin", "George Devol"], answer: "Nikola Tesla" },
      { question: "In 1937, who published a paper on mathematics of fundamental importance to future computer development?", options: ["Alan Turing", "George Boole", "Charles Babbage", "Norbert Wiener"], answer: "Alan Turing" },
      { question: "In which 1942 short story did Isaac Asimov give the world his three laws of robotics?", options: ["Runaround", "I, Robot", "Cybernetics", "Rossum’s Universal Robots"], answer: "Runaround" },
      { question: "Who published 'A Logical Calculus of the Ideas Immanent in Nervous Activity' in 1943?", options: ["Norbert Wiener", "Warren S. McCulloch and Walt Pitts", "Marvin Minsky", "Alan Turing"], answer: "Warren S. McCulloch and Walt Pitts" },
      { question: "Who received a 1961 patent for an arm-type industrial robot used by GM?", options: ["George Devol", "Marvin Minsky", "Joseph Engelberger", "Raymond Goertz"], answer: "George Devol" },
      { question: "Which company started producing hydraulically powered robots under the Unimation license in 1968?", options: ["Honda", "Kawasaki Robotics", "SpaceX", "Makino"], answer: "Kawasaki Robotics" },
      { question: "Who developed a robot arm based on a tentacle in 1968?", options: ["Marvin Minsky", "Raymond Goertz", "George Devol", "Hiroshi Makino"], answer: "Marvin Minsky" },
      { question: "How many joints did Marvin Minsky's tentacle arm have?", options: ["6", "8", "12", "15"], answer: "12" },
      { question: "Between 1970 and 1973, Waseda University created the world's first anthropomorphic robot named:", options: ["ASIMO", "P2", "WABOT-1", "SCARA"], answer: "WABOT-1" },
      { question: "Which institution created WABOT-1?", options: ["Waseda University", "MIT", "De La Salle University", "National University of Singapore"], answer: "Waseda University" },
      { question: "In 1997, Honda introduced which bipedal humanoid robot that walks smoothly for over 30 minutes?", options: ["ASIMO", "P2", "P3", "WABOT-1"], answer: "P2" },
      { question: "Which company created the P2 bipedal humanoid robot?", options: ["Honda", "Kawasaki Robotics", "SpaceX", "Intuitive Surgical"], answer: "Honda" },
      { question: "In 1999, Intuitive Surgical Inc. introduced which medical robotic system?", options: ["da Vinci", "ASIMO", "SCARA", "Sojourner"], answer: "da Vinci" },
      { question: "In what year was the da Vinci system approved for laparoscopic surgery?", options: ["1997", "1999", "2000", "2003"], answer: "2000" },
      { question: "What does ASIMO stand for?", options: ["Automated System in Mobility", "Advanced Step in Innovative Mobility", "Articulated System in Motor Operations", "Advanced Stepping in Mechanical Optimization"], answer: "Advanced Step in Innovative Mobility" },
      { question: "Which company created ASIMO in 2000?", options: ["Honda", "Kawasaki", "SpaceX", "Waseda University"], answer: "Honda" },
      { question: "In 2000, what did Waseda University create to reproduce human vocal movement?", options: ["Waseda Talker No. 1", "ASIMO Vocal", "WABOT Voice", "Cybernetic Voice"], answer: "Waseda Talker No. 1" },
      { question: "In 2012, which became the first privately owned company to launch and dock a robotic capsule with the ISS?", options: ["Blue Origin", "SpaceX", "Boeing", "Lockheed Martin"], answer: "SpaceX" },
      { question: "What is the name of SpaceX's robotic capsule?", options: ["Apollo", "Falcon", "Dragon", "Eagle"], answer: "Dragon" },
      { question: "Who founded the privately owned company SpaceX?", options: ["Elon Musk", "Jeff Bezos", "Nikola Tesla", "Thomas Edison"], answer: "Elon Musk" },
      { question: "What does SCOT stand for?", options: ["Shared Computer Operated Transport", "Systematic Computer Optimized Transport", "Sensory Controlled Operations Terminal", "Simulated Computer Output Tech"], answer: "Shared Computer Operated Transport" },
      { question: "SCOT is an autonomous driverless car developed by the National University of Singapore in collaboration with:", options: ["Harvard", "Waseda University", "MIT", "De La Salle University"], answer: "MIT" },
      { question: "Who led the development of SCOT?", options: ["Marcelo Ang", "Hiroshi Makino", "Marvin Minsky", "George Devol"], answer: "Marcelo Ang" },
      { question: "What does BRAVE stand for?", options: ["Bomb Removal Automated Vehicle", "Bipedal Robotic Automated Vehicle", "Basic Remote Arm Vehicle", "Bio-Robotic Arm Vehicle Explorer"], answer: "Bomb Removal Automated Vehicle" },
      { question: "Which university developed BRAVE for bomb disposal and remote inspection?", options: ["National University of Singapore", "Waseda University", "De La Salle University", "MIT"], answer: "De La Salle University" },
      { question: "What was the name of the first rover on Mars?", options: ["Sojourner", "Spirit", "Opportunity", "Curiosity"], answer: "Sojourner" },
      { question: "When did the Sojourner rover launch?", options: ["Dec 4, 1996", "July 4, 1997", "June 10, 2003", "Nov 26, 2011"], answer: "Dec 4, 1996" },
      { question: "When did the Sojourner rover land on Mars?", options: ["Dec 4, 1996", "July 4, 1997", "Jan 3, 2004", "Jan 24, 2004"], answer: "July 4, 1997" },
      { question: "Which Mars rover found evidence of past water and ancient explosive volcanic activity before getting permanently stuck in soft sand?", options: ["Sojourner", "Spirit", "Opportunity", "Curiosity"], answer: "Spirit" },
      { question: "When did the Spirit rover launch?", options: ["Dec 4, 1996", "June 10, 2003", "July 7, 2003", "Nov 26, 2011"], answer: "June 10, 2003" },
      { question: "When did the Spirit rover land?", options: ["July 4, 1997", "Jan 3, 2004", "Jan 24, 2004", "Aug 6, 2012"], answer: "Jan 3, 2004" },
      { question: "Which Mars rover discovered hematite 'blueberries' proving ancient acidic water existed?", options: ["Sojourner", "Spirit", "Opportunity", "Perseverance"], answer: "Opportunity" },
      { question: "When did the Opportunity rover launch?", options: ["June 10, 2003", "July 7, 2003", "Nov 26, 2011", "July 30, 2020"], answer: "July 7, 2003" },
      { question: "When did the Opportunity rover land?", options: ["Jan 3, 2004", "Jan 24, 2004", "Aug 6, 2012", "Feb 18, 2021"], answer: "Jan 24, 2004" },
      { question: "When did the Opportunity rover's mission end?", options: ["March 2010", "June 2018", "July 2020", "Active today"], answer: "June 2018" },
      { question: "The Opportunity rover holds the off-Earth driving record of:", options: ["15.50 miles", "28.06 miles", "40.12 miles", "50.00 miles"], answer: "28.06 miles" },
      { question: "Which rover pioneered the autonomous 'Sky Crane' landing method?", options: ["Spirit", "Opportunity", "Curiosity", "Perseverance"], answer: "Curiosity" },
      { question: "When did the Curiosity rover launch?", options: ["July 7, 2003", "Nov 26, 2011", "July 30, 2020", "Dec 4, 1996"], answer: "Nov 26, 2011" },
      { question: "When did the Curiosity rover land?", options: ["Jan 24, 2004", "Aug 6, 2012", "Feb 18, 2021", "July 4, 1997"], answer: "Aug 6, 2012" },
      { question: "Which rover deployed Ingenuity, the first helicopter to fly on another planet?", options: ["Curiosity", "Perseverance", "Opportunity", "Spirit"], answer: "Perseverance" },
      { question: "When did the Perseverance rover launch?", options: ["Nov 26, 2011", "July 30, 2020", "Aug 6, 2012", "Feb 18, 2021"], answer: "July 30, 2020" },
      { question: "When did the Perseverance rover land?", options: ["Aug 6, 2012", "Feb 18, 2021", "June 2018", "March 2010"], answer: "Feb 18, 2021" },
      { question: "What does SCARA stand for?", options: ["Systematic Controlled Articulated Robot Arm", "Selective Compliance Articulated Robot Arm", "Sequential Computer Automated Robot Arm", "Standard Compliant Articulated Robot Assembly"], answer: "Selective Compliance Articulated Robot Arm" },
      { question: "Who invented the SCARA architecture in 1978?", options: ["Professor Hiroshi Makino", "Marcelo Ang", "George Devol", "Marvin Minsky"], answer: "Professor Hiroshi Makino" },
      { question: "Who coined the phrase 'Data is the new oil' in relation to Data Mining?", options: ["Alan Turing", "Clive Humby", "Elon Musk", "George Boole"], answer: "Clive Humby" },
      { question: "What is defined as the scientific process of extracting valuable information from both structured and unstructured data?", options: ["Data Mining", "Data Science", "Boolean Algebra", "Cybernetics"], answer: "Data Science" }
    ];

    // --- SHUFFLE FUNCTION ADDED HERE ---
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
    
    // Randomize the 70 questions before starting
    shuffleArray(quizData);
    // -----------------------------------

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      const feedback = document.getElementById("feedback");
      feedback.innerText = "";
      feedback.style.color = "#fff";

      // Update progress bar
      const progress = ((currentQuestion) / quizData.length) * 100;
      document.getElementById("progress-bar").style.width = `${progress}%`;

      if (currentQuestion >= quizData.length) {
        document.getElementById("quiz-container").innerHTML = `
          <div class="score-text">Quiz Complete!</div>
          <p style="text-align:center;">You scored <strong>${score}</strong> out of ${quizData.length}.</p>
          <button class="option-btn" style="text-align:center; background:#4facfe; color:#fff;" onclick="location.reload()">Restart Quiz</button>
        `;
        document.getElementById("quiz-title").style.display = "none";
        return;
      }
      
      const q = quizData[currentQuestion];
      document.getElementById("question-text").innerText = `Q${currentQuestion + 1}: ${q.question}`;
      
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      // Shuffle the options so they aren't always in the same place
      let shuffledOptions = [...q.options];
      shuffleArray(shuffledOptions);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = (e) => checkAnswer(opt, q.answer, e.target, optionsContainer);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, clickedBtn, container) {
      const buttons = container.querySelectorAll("button");
      buttons.forEach(btn => btn.disabled = true); // Lock answers

      const feedback = document.getElementById("feedback");

      if (selected === correct) {
        score++;
        clickedBtn.classList.add("correct-btn");
        feedback.innerText = "Correct!";
        feedback.style.color = "#28a745";
      } else {
        clickedBtn.classList.add("wrong-btn");
        feedback.innerText = `Wrong! The correct answer was: ${correct}`;
        feedback.style.color = "#dc3545";
        
        // Highlight correct answer
        buttons.forEach(btn => {
          if (btn.innerText === correct) btn.classList.add("correct-btn");
        });
      }
      
      currentQuestion++;
      setTimeout(loadQuestion, 2000); // 2-second delay to read the result
    }

    loadQuestion();
  </script>
</body>
</html>
