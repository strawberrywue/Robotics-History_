<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics & Computing History Quiz</title>
    <!-- Use Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom base styles and animations */
        body {
            /* A tech-inspired gradient background */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Glassmorphism utility for the quiz card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Smooth transitions for the option buttons */
        .option-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Prevent clicking after an answer is selected */
        .disabled-btn {
            pointer-events: none;
        }

        /* Specific styles injected dynamically via JS for correct/incorrect */
        .correct-answer {
            background-color: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .wrong-answer {
            background-color: rgba(244, 63, 94, 0.2) !important;
            border-color: #f43f5e !important;
            color: #fb7185 !important;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.3);
        }

        /* Fade-in animation for questions */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex items-center justify-center p-4">

    <!-- Main Quiz Container -->
    <main class="glass-card w-full max-w-3xl rounded-3xl p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Decoration / Glow effects behind the card -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <!-- Header Section -->
        <header class="relative z-10 mb-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-2">
                Robotics & Computing History
            </h1>
            <p class="text-slate-400 text-sm sm:text-base">Test your knowledge on the evolution of technology.</p>
        </header>

        <!-- Quiz Area (Visible during quiz) -->
        <div id="quiz-area" class="relative z-10">
            
            <!-- Progress Bar -->
            <div class="mb-8">
                <div class="flex justify-between text-sm text-slate-400 mb-2 font-medium">
                    <span id="question-tracker">Question 1 of 15</span>
                    <span id="score-tracker">Score: 0</span>
                </div>
                <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                    <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0 transition-all duration-500 ease-out"></div>
                </div>
            </div>

            <!-- Question & Options -->
            <div id="question-container" class="fade-in">
                <h2 id="question-text" class="text-xl sm:text-2xl font-semibold mb-6 leading-relaxed">
                    Loading question...
                </h2>
                <div id="options-container" class="flex flex-col gap-3 sm:gap-4">
                    <!-- Options injected here by JS -->
                </div>
            </div>

            <!-- Feedback Message (Correct/Wrong) -->
            <div id="feedback-message" class="mt-6 text-center text-lg font-semibold h-8 opacity-0 transition-opacity duration-300">
                <!-- Feedback injected here -->
            </div>
        </div>

        <!-- Results Area (Hidden by default) -->
        <div id="results-area" class="relative z-10 hidden text-center py-8 fade-in">
            <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-slate-800 border-4 border-purple-500 mb-6">
                <svg class="w-12 h-12 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Quiz Completed!</h2>
            <p class="text-slate-300 text-lg mb-6">You scored <span id="final-score" class="text-2xl font-bold text-blue-400">0</span> out of <span id="total-questions" class="font-bold">15</span>.</p>
            
            <button onclick="restartQuiz()" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold rounded-xl shadow-lg shadow-purple-500/30 transform hover:-translate-y-1 transition-all duration-200">
                Retake Quiz
            </button>
        </div>

    </main>

    <script>
        // Quiz Data based exactly on the provided 15 facts
        const quizData = [
            {
                question: "Who invented the textile machine operated by punch cards in 1801?",
                options: ["Charles Babbage", "George Boole", "Joseph Jacquard", "Nikola Tesla"],
                answer: "Joseph Jacquard"
            },
            {
                question: "Who introduced the word “robot” in the 1921 play Rossum’s Universal Robots?",
                options: ["Isaac Asimov", "Karel Čapek", "George Devol", "Blaise Pascal"],
                answer: "Karel Čapek"
            },
            {
                question: "Who formulated the “Three Laws of Robotics” in 1939?",
                options: ["Norbert Wiener", "Alan Turing", "Isaac Asimov", "Karel Čapek"],
                answer: "Isaac Asimov"
            },
            {
                question: "Who designed the first programmable robot in 1954 and coined 'universal automation'?",
                options: ["Joseph Engelberger", "George Devol", "Marvin Minsky", "Hiroshi Makino"],
                answer: "George Devol"
            },
            {
                question: "Who built an early version of the calculator in 1642?",
                options: ["Benjamin Franklin", "Thomas Edison", "Charles Babbage", "Blaise Pascal"],
                answer: "Blaise Pascal"
            },
            {
                question: "Who designed the analytical engine in 1835?",
                options: ["Charles Babbage", "George Boole", "Joseph Jacquard", "Nikola Tesla"],
                answer: "Charles Babbage"
            },
            {
                question: "Who published Mathematical Analysis of Logic in 1847, later known as Boolean algebra?",
                options: ["Alan Turing", "Blaise Pascal", "George Boole", "Charles Babbage"],
                answer: "George Boole"
            },
            {
                question: "Who designed the world's first AC power plant at Niagara Falls in 1895?",
                options: ["Thomas Edison", "Nikola Tesla", "George Westinghouse", "Benjamin Franklin"],
                answer: "Nikola Tesla"
            },
            {
                question: "Which university created WABOT-1, the world's first anthropomorphic robot, between 1970-1973?",
                options: ["MIT", "Stanford University", "National University of Singapore", "Waseda University"],
                answer: "Waseda University"
            },
            {
                question: "Which company introduced the P2 bipedal humanoid robot in 1997?",
                options: ["Toyota", "Kawasaki", "Honda", "Tesla"],
                answer: "Honda"
            },
            {
                question: "What famous robot did Honda create in 2000?",
                options: ["ASIMO", "WABOT-1", "SCOT", "P2"],
                answer: "ASIMO"
            },
            {
                question: "Which company became the first privately owned entity to dock the robotic Dragon capsule with the ISS in 2012?",
                options: ["Blue Origin", "SpaceX", "Boeing", "Lockheed Martin"],
                answer: "SpaceX"
            },
            {
                question: "Which Mars rover pioneered the autonomous 'Sky Crane' landing method?",
                options: ["Sojourner", "Spirit", "Perseverance", "Curiosity"],
                answer: "Curiosity"
            },
            {
                question: "Which Mars rover deployed Ingenuity, the first helicopter to fly on another planet?",
                options: ["Opportunity", "Curiosity", "Perseverance", "Spirit"],
                answer: "Perseverance"
            },
            {
                question: "Who invented the SCARA robotic architecture in 1978?",
                options: ["Professor Hiroshi Makino", "George Devol", "Joseph Engelberger", "Marvin Minsky"],
                answer: "Professor Hiroshi Makino"
            }
        ];

        // State variables
        let currentQuestionIndex = 0;
        let score = 0;

        // DOM Elements
        const quizArea = document.getElementById('quiz-area');
        const resultsArea = document.getElementById('results-area');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionTracker = document.getElementById('question-tracker');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const feedbackMessage = document.getElementById('feedback-message');
        const questionContainer = document.getElementById('question-container');

        // Initialize Quiz
        function loadQuestion() {
            // Reset state for new question
            feedbackMessage.style.opacity = '0';
            optionsContainer.innerHTML = '';
            
            // Re-trigger fade-in animation
            questionContainer.classList.remove('fade-in');
            void questionContainer.offsetWidth; // Trigger reflow
            questionContainer.classList.add('fade-in');

            const currentQuestion = quizData[currentQuestionIndex];
            
            // Update UI trackers
            questionTracker.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            scoreTracker.innerText = `Score: ${score}`;
            questionText.innerText = currentQuestion.question;
            
            // Update Progress Bar
            const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
            progressBarFill.style.width = `${progressPercentage}%`;

            // Create option buttons
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option;
                // Tailwind classes for buttons
                button.className = 'option-btn w-full text-left p-4 sm:p-5 rounded-xl bg-slate-800/60 hover:bg-slate-700 border border-slate-600 text-slate-200 font-medium text-base sm:text-lg shadow-sm hover:-translate-y-1 hover:shadow-md focus:outline-none';
                button.onclick = () => checkAnswer(button, option, currentQuestion.answer);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedButton, selectedOption, correctAnswer) {
            // Disable all buttons immediately to prevent multiple clicks
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.classList.add('disabled-btn'));

            // Check if correct
            if (selectedOption === correctAnswer) {
                score++;
                selectedButton.classList.add('correct-answer');
                feedbackMessage.innerText = "Correct! ✨";
                feedbackMessage.className = "mt-6 text-center text-lg font-bold text-emerald-400";
            } else {
                selectedButton.classList.add('wrong-answer');
                feedbackMessage.innerHTML = `Incorrect. <span class="text-slate-300 font-normal">The right answer was</span> <b class="text-emerald-400">${correctAnswer}</b>.`;
                feedbackMessage.className = "mt-6 text-center text-lg font-bold text-rose-400";
                
                // Highlight the correct answer as well
                allButtons.forEach(btn => {
                    if (btn.innerText === correctAnswer) {
                        btn.classList.add('!border-emerald-500', '!text-emerald-400', 'bg-slate-800/90');
                    }
                });
            }

            scoreTracker.innerText = `Score: ${score}`;
            feedbackMessage.style.opacity = '1';

            // Wait 2 seconds before moving to next question
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 2500); // slightly longer delay so the user can read the correct answer
        }

        function showResults() {
            // Hide quiz, show results
            quizArea.classList.add('hidden');
            resultsArea.classList.remove('hidden');
            
            // Set final progress bar to 100% (hidden technically, but good practice)
            progressBarFill.style.width = '100%';

            // Populate scores
            document.getElementById('final-score').innerText = score;
            document.getElementById('total-questions').innerText = quizData.length;
        }

        function restartQuiz() {
            // Reset variables
            currentQuestionIndex = 0;
            score = 0;
            
            // Toggle visibility
            resultsArea.classList.add('hidden');
            quizArea.classList.remove('hidden');
            
            // Start again
            loadQuestion();
        }

        // Initialize first question on load
        loadQuestion();
    </script>
</body>
</html>
