<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    .question { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
    button { display: block; width: 100%; padding: 10px; margin: 8px 0; font-size: 1em; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9; text-align: left; }
    button:hover { background: #e9e9e9; }
    #result-message { font-weight: bold; margin-top: 15px; height: 24px; }
    .correct { color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>

  <h1>My History Quiz</h1>
  <div id="quiz-container">
    <div class="question" id="question-text">Loading...</div>
    <div id="options-container"></div>
  </div>
  <p id="result-message"></p>

  <script>
    // Add your questions here!
    const quizData = [
      {
        question: "Who formulated the Three Laws of Robotics in 1939?",
        options: ["Alan Turing", "George Devol", "Isaac Asimov", "Norbert Wiener"],
        answer: "Isaac Asimov"
      },
      {
        question: "Which Mars rover pioneered the autonomous Sky Crane landing method?",
        options: ["Sojourner", "Spirit", "Curiosity", "Perseverance"],
        answer: "Curiosity"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      if (currentQuestion >= quizData.length) {
        document.getElementById("quiz-container").innerHTML = `<h2>Quiz Complete!</h2><p>You scored ${score} out of ${quizData.length}.</p>`;
        return;
      }
      
      const q = quizData[currentQuestion];
      document.getElementById("question-text").innerText = q.question;
      const optionsContainer = document.getElementById("options-container");
      optionsContainer.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.answer);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      const msg = document.getElementById("result-message");
      if (selected === correct) {
        score++;
        msg.innerText = "Correct!";
        msg.className = "correct";
      } else {
        msg.innerText = `Wrong! The correct answer was: ${correct}`;
        msg.className = "wrong";
      }
      
      currentQuestion++;
      // Wait 1.5 seconds before loading the next question
      setTimeout(() => {
        msg.innerText = "";
        loadQuestion();
      }, 1500);
    }

    loadQuestion();
  </script>
</body>
</html>
